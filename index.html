<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json" />
  <title>Sistem Keuangan & POS Toko</title>
  <link rel="stylesheet" href="./css/style.css" />
  <!-- Library Scanner Barcode Kamera (Ringan via CDN) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
  <!-- Bar Status Koneksi (Offline-First Indicator) -->
  <header class="topbar">
    <div class="brand">
      <strong id="store-name">TOKO INTERNAL</strong>
      <span id="user-badge" class="badge hidden">Role</span>
    </div>
    <div class="topbar-right">
      <span id="network-status" class="status-pill online">Online</span>
      <button id="btn-logout" class="btn-sm btn-danger hidden">Keluar</button>
    </div>
  </header>

  <!-- Halaman Login (Muncul jika belum login) -->
  <main id="auth-view" class="container">
    <div class="card auth-card">
      <h2>Login Sistem Toko</h2>
      <p class="text-muted">Masuk menggunakan akun Owner, Staf, atau Kasir.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="kasir@toko.id" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary btn-block">Masuk</button>
        <p id="login-error" class="error-text hidden"></p>
      </form>
    </div>
  </main>

  <!-- Kontainer Utama SPA (Muncul setelah login berhasil) -->
  <div id="app-view" class="hidden">
    <!-- Navigasi Dinamis Berdasarkan Role -->
    <nav id="main-nav" class="bottom-nav"></nav>

    <!-- Area Konten Modul SPA -->
    <main id="view-container" class="container">
      <p class="text-muted">Memuat modul...</p>
    </main>
  </div>

  <!-- Modal Verifikasi PIN Owner (Wajib untuk Void / Retur Kasir) -->
  <div id="modal-pin" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3>Otorisasi PIN Owner</h3>
      <p id="pin-reason" class="text-muted">Tindakan ini memerlukan persetujuan Owner.</p>
      <input
        type="password"
        id="owner-pin-input"
        inputmode="numeric"
        maxlength="6"
        placeholder="Masukkan 6 digit PIN"
      />
      <p id="pin-error" class="error-text hidden"></p>
      <div class="modal-actions">
        <button type="button" id="btn-pin-cancel" class="btn-secondary">Batal</button>
        <button type="button" id="btn-pin-confirm" class="btn-primary">Verifikasi</button>
      </div>
    </div>
  </div>

  <!-- Entry Point ES Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
